spring.application.name=brewery

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brewery}
spring.datasource.username=${DB_USERNAME:brewery}
spring.datasource.password=${DB_PASSWORD:brewery}

# Runs ApplicationModules.verify() during startup: a module boundary violation stops the app before it serves requests.
spring.modulith.runtime.verification-enabled=true

# Event Publication Registry: the table comes from Flyway (V5), not from the starter's own schema script.
spring.modulith.events.jdbc.schema-initialization.enabled=false
# Completed publications keep their row (status COMPLETED) until EventPublicationMaintenance purges them.
spring.modulith.events.completion-mode=update
# Publications stuck in a status longer than this (e.g. the instance died mid-listener) are marked FAILED.
spring.modulith.events.staleness.published=PT1M
spring.modulith.events.staleness.processing=PT1M
spring.modulith.events.staleness.resubmitted=PT1M
spring.modulith.events.staleness.check-interval=PT30S

# EventPublicationMaintenance: resubmits FAILED publications and purges old COMPLETED ones.
brewery.events.resubmission.interval=PT30S
brewery.events.resubmission.min-age=PT30S
brewery.events.resubmission.max-in-flight=20
brewery.events.purge.interval=PT1H
brewery.events.purge.retention=P7D
